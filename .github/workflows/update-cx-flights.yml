name: Update CX Flights

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-flights:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Fetch and merge CX passenger flights
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
        run: node update-flights.mjs

      - name: Commit updated flight data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add flights.json flights-meta.json flight-time-audit.json

          if git diff --cached --quiet; then
            echo "No files changed."
          else
            git commit -m "chore: refresh CX flight timetable"
            git push
          fi
